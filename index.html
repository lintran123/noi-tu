<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nối từ online (P2P)</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a18;
    color: #f2f0ea;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { text-align: center; font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  .sub { text-align: center; color: #a3a199; font-size: 14px; margin: 0 0 20px; }

  .card {
    background: #232320;
    border: 1px solid #3d3d39;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  label { display: block; font-size: 13px; color: #a3a199; margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #3d3d39;
    background: #1a1a18;
    color: #f2f0ea;
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
  }
  input[type=text]:focus { border-color: #7a7870; }
  button.primary {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #f2f0ea;
    color: #1a1a18;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  .or-divider {
    text-align: center;
    color: #7a7870;
    font-size: 12px;
    margin: 14px 0;
  }
  .hidden { display: none; }

  .room-code-box {
    background: #1a1a18;
    border: 1px dashed #55534c;
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    margin-bottom: 10px;
  }
  .room-code-box .code {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #8fe0b8;
  }
  .copy-btn {
    margin-top: 8px;
    background: transparent;
    border: 1px solid #3d3d39;
    color: #a3a199;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .status-line {
    text-align: center;
    font-size: 13px;
    color: #a3a199;
    margin-bottom: 4px;
  }

  .room-info {
    text-align: center;
    font-size: 13px;
    color: #a3a199;
    margin-bottom: 16px;
  }
  .room-info b { color: #f2f0ea; }

  .turn-badge { text-align: center; margin-bottom: 16px; }
  .turn-badge span {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
  }
  .p1 { background: #2b4a3e; color: #8fe0b8; }
  .p2 { background: #3a3050; color: #c3aef0; }

  .board {
    background: #232320;
    border: 1px solid #3d3d39;
    border-radius: 12px;
    padding: 16px;
    height: 280px;
    overflow-y: auto;
    margin-bottom: 16px;
  }
  .chain-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 15px;
  }
  .chain-item.p1 { background: rgba(143,224,184,0.08); }
  .chain-item.p2 { background: rgba(195,174,240,0.08); }
  .chain-item .who { font-size: 11px; font-weight: 700; min-width: 46px; color: #a3a199; }
  .chain-item .word { font-weight: 500; }
  .empty-hint { color: #7a7870; font-size: 13px; text-align: center; padding-top: 40px; }

  form { display: flex; gap: 8px; margin-bottom: 10px; }
  form input[type=text] { margin-bottom: 0; }
  .msg { min-height: 20px; font-size: 13px; text-align: center; margin-bottom: 14px; }
  .msg.error { color: #e88; }
  .msg.ok { color: #8ea; }
  .msg.wait { color: #a3a199; }

  .footer-row { display: flex; justify-content: center; margin-top: 6px; }
  .reset-btn {
    background: transparent;
    border: 1px solid #3d3d39;
    color: #a3a199;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .note { font-size: 11px; color: #7a7870; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Nối từ online</h1>
  <p class="sub">Kết nối trực tiếp 2 máy (P2P) &middot; không qua server lưu dữ liệu</p>

  <div id="setup-screen">
    <div class="card">
      <h3>Tạo phòng mới</h3>
      <button class="primary" id="create-btn">Tạo phòng</button>
      <div id="host-code-area" class="hidden" style="margin-top:14px;">
        <div class="room-code-box">
          <div class="status-line">Gửi mã này cho bạn của bạn:</div>
          <div class="code" id="host-code">...</div>
          <button class="copy-btn" id="copy-btn">Sao chép mã</button>
        </div>
        <div class="status-line" id="host-status">Đang chờ bạn kết nối vào...</div>
      </div>
    </div>

    <div class="or-divider">— hoặc —</div>

    <div class="card">
      <h3>Vào phòng bằng mã</h3>
      <label for="join-code">Nhập mã phòng bạn vừa nhận được</label>
      <input type="text" id="join-code" placeholder="vd: ab12cd34" />
      <button class="primary" id="join-btn">Kết nối</button>
      <div class="status-line" id="join-status" style="margin-top:10px;"></div>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <div class="room-info">Bạn là <b id="my-role-label"></b></div>
    <div class="turn-badge"><span id="turn-label" class="p1">Lượt của người 1</span></div>
    <div class="board" id="board"></div>
    <form id="form" autocomplete="off">
      <input type="text" id="word-input" placeholder="Nhập từ (vd: học sinh)" />
      <button type="submit" class="primary" style="width:auto; padding:12px 20px;">Nối</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="footer-row">
      <button class="reset-btn" id="reset-btn">Chơi lại (xóa chuỗi)</button>
    </div>
  </div>

  <div id="debug-log" style="background:#0f0f0e; border:1px solid #3d3d39; border-radius:8px; padding:10px; font-size:11px; font-family:monospace; color:#8fa88f; max-height:140px; overflow-y:auto; margin-top:14px;"></div>
</div>


<script>
  const setupScreen = document.getElementById('setup-screen');
  const gameScreen = document.getElementById('game-screen');
  const createBtn = document.getElementById('create-btn');
  const hostCodeArea = document.getElementById('host-code-area');
  const hostCodeEl = document.getElementById('host-code');
  const copyBtn = document.getElementById('copy-btn');
  const hostStatus = document.getElementById('host-status');
  const joinCodeInput = document.getElementById('join-code');
  const joinBtn = document.getElementById('join-btn');
  const joinStatus = document.getElementById('join-status');

  const myRoleLabel = document.getElementById('my-role-label');
  const board = document.getElementById('board');
  const form = document.getElementById('form');
  const input = document.getElementById('word-input');
  const msg = document.getElementById('msg');
  const turnLabel = document.getElementById('turn-label');
  const resetBtn = document.getElementById('reset-btn');

  let peer = null;
  let conn = null;
  let myRole = null; // 1 = host, 2 = joiner
  let state = { chain: [], currentPlayer: 1 };

  function randomCode() {
    return Math.random().toString(36).slice(2, 10);
  }

  function normalize(str) {
    return str.trim().toLowerCase().replace(/\s+/g, ' ');
  }
  function lastSyllable(str) {
    const parts = normalize(str).split(' ');
    return parts[parts.length - 1];
  }
  function firstSyllable(str) {
    const parts = normalize(str).split(' ');
    return parts[0];
  }

  function renderBoard() {
    board.innerHTML = '';
    if (!state.chain.length) {
      board.innerHTML = '<div class="empty-hint">Chưa có từ nào, hãy bắt đầu chuỗi</div>';
      return;
    }
    state.chain.forEach(item => {
      const div = document.createElement('div');
      div.className = 'chain-item p' + item.player;
      div.innerHTML = `<span class="who">Người ${item.player}</span><span class="word">${item.word}</span>`;
      board.appendChild(div);
    });
    board.scrollTop = board.scrollHeight;
  }

  function renderTurn() {
    turnLabel.textContent = 'Lượt của người ' + state.currentPlayer;
    turnLabel.className = 'p' + state.currentPlayer;
    if (state.currentPlayer === myRole) {
      showMsg('Đến lượt bạn!', 'ok');
    } else {
      showMsg('Đang chờ đối phương...', 'wait');
    }
  }

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + (type || '');
  }

  function enterGameScreen() {
    setupScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    myRoleLabel.textContent = 'người ' + myRole;
    renderBoard();
    renderTurn();
    input.focus();
  }

  function setupConnection(connection) {
    conn = connection;
    conn.on('data', (data) => {
      if (data.type === 'state') {
        state = data.state;
        renderBoard();
        renderTurn();
      }
    });
    conn.on('open', () => {
      enterGameScreen();
      if (myRole === 1) {
        conn.send({ type: 'state', state: state });
      }
    });
    conn.on('close', () => {
      showMsg('Mất kết nối với đối phương.', 'error');
    });
  }

  function log(text) {
    const debugLog = document.getElementById('debug-log');
    if (!debugLog) return;
    const line = document.createElement('div');
    const t = new Date().toLocaleTimeString();
    line.textContent = '[' + t + '] ' + text;
    debugLog.appendChild(line);
    debugLog.scrollTop = debugLog.scrollHeight;
  }

  log(typeof Peer === 'undefined' ? 'LỖI: thư viện PeerJS không tải được (kiểm tra mạng/CDN)' : 'Thư viện PeerJS đã tải OK');

    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    }
  };

  createBtn.addEventListener('click', () => {
    myRole = 1;
    const code = randomCode();
    createBtn.disabled = true;
    log('Đang tạo phòng với mã: ' + code);
    peer = new Peer(code, peerConfig);
    peer.on('open', (id) => {
      log('Peer đã mở thành công, ID: ' + id);
      hostCodeArea.classList.remove('hidden');
      hostCodeEl.textContent = id;
    });
    peer.on('connection', (connection) => {
      log('Có người kết nối vào! Đang bắt tay...');
      hostStatus.textContent = 'Đã có người kết nối!';
      setupConnection(connection);
    });
    peer.on('error', (err) => {
      log('LỖI phía host: ' + err.type + ' - ' + (err.message || ''));
      hostStatus.textContent = 'Lỗi: ' + err.type + '. Thử tạo phòng lại.';
      createBtn.disabled = false;
    });
    peer.on('disconnected', () => log('Peer bị ngắt kết nối khỏi server tín hiệu'));
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(hostCodeEl.textContent).then(() => {
      copyBtn.textContent = 'Đã sao chép!';
      setTimeout(() => { copyBtn.textContent = 'Sao chép mã'; }, 1500);
    });
  });

  joinBtn.addEventListener('click', () => {
    const code = joinCodeInput.value.trim();
    if (!code) {
      joinStatus.textContent = 'Nhập mã phòng trước đã.';
      return;
    }
    myRole = 2;
    joinBtn.disabled = true;
    joinStatus.textContent = 'Đang kết nối...';
    log('Đang thử vào phòng mã: ' + code);
    peer = new Peer(peerConfig);
    peer.on('open', (myId) => {
      log('Peer của bạn đã mở, ID: ' + myId + '. Đang gọi tới phòng...');
      const connection = peer.connect(code);
      const timeoutId = setTimeout(() => {
        log('LỖI: quá 15 giây không bắt tay xong (có thể do NAT/tường lửa)');
        joinStatus.textContent = 'Kết nối quá lâu. Mạng của bạn hoặc người tạo phòng có thể đang chặn. Thử đổi sang wifi khác hoặc 4G rồi thử lại.';
        joinBtn.disabled = false;
      }, 15000);
      connection.on('open', () => {
        log('Bắt tay thành công! Đã kết nối.');
        clearTimeout(timeoutId);
        setupConnection(connection);
      });
      connection.on('error', (err) => {
        log('LỖI kết nối data channel: ' + (err.message || err));
        clearTimeout(timeoutId);
        joinStatus.textContent = 'Không kết nối được. Kiểm tra lại mã phòng.';
        joinBtn.disabled = false;
      });
    });
    peer.on('error', (err) => {
      log('LỖI phía join: ' + err.type + ' - ' + (err.message || ''));
      joinStatus.textContent = 'Lỗi: ' + err.type + '. Kiểm tra lại mã phòng.';
      joinBtn.disabled = false;
    });
    peer.on('disconnected', () => log('Peer bị ngắt kết nối khỏi server tín hiệu'));
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (state.currentPlayer !== myRole) {
      showMsg('Chưa đến lượt bạn.', 'error');
      return;
    }
    const raw = input.value;
    const word = normalize(raw);
    if (!word) { showMsg('Bạn chưa nhập từ.', 'error'); return; }

    const syllables = word.split(' ');
    if (syllables.length < 2) {
      showMsg('Từ phải có ít nhất 2 âm tiết (vd: "con mèo").', 'error');
      return;
    }
    const used = new Set(state.chain.map(c => c.word));
    if (used.has(word)) {
      showMsg('Từ này đã được dùng rồi, thử từ khác.', 'error');
      return;
    }
    if (state.chain.length > 0) {
      const prevLast = lastSyllable(state.chain[state.chain.length - 1].word);
      const newFirst = firstSyllable(word);
      if (prevLast !== newFirst) {
        showMsg(`Từ phải bắt đầu bằng "${prevLast}".`, 'error');
        return;
      }
    }

    state.chain.push({ word: word, player: myRole });
    state.currentPlayer = myRole === 1 ? 2 : 1;
    renderBoard();
    renderTurn();
    if (conn) conn.send({ type: 'state', state: state });
    input.value = '';
    input.focus();
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('Xóa toàn bộ chuỗi từ?')) return;
    state = { chain: [], currentPlayer: 1 };
    renderBoard();
    renderTurn();
    if (conn) conn.send({ type: 'state', state: state });
  });
</script>
</body>
</html>
